[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436) but carries no security vuln and
    # has no drop-in replacement path — ratatui pins it. Revisit if ratatui drops it.
    "RUSTSEC-2024-0436",
    # unsafe-libyaml is unmaintained (RUSTSEC-2024-0449). The advisory is
    # informational, not a vulnerability, and lists no patched version: 0.2.11,
    # the version locked here, is its last release, so there is no maintained
    # release to move to. serde_yaml_ng pulls it in, and serde_yaml_ng parses
    # workflow YAML: the workflows compiled into the binary (bundled.rs), the
    # user-installed workflow files in the workflows directory (external.rs),
    # and the file `ags workflow add` validates before installing it
    # (facade/workflow.rs). Revisit when serde_yaml_ng is replaced.
    "RUSTSEC-2024-0449",
]
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# ags-protocol / ags-runtime are internal workspace crates referenced by path
# (versionless), which reads as a wildcard; allow that for path deps only.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index", "https://index.crates.io/"]
allow-git = []
