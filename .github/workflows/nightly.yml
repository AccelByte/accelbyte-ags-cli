name: Nightly

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Snapshot commit on the nightly branch, pushed by GitLab
        required: true
        type: string
      source_pipeline_url:
        description: Source GitLab pipeline for this build
        required: true
        type: string

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-source:
    name: Verify dispatched commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Validated before checkout so a malformed input never reaches git, and
      # passed through env so the value is never interpolated into the script.
      - name: Check commit SHA format
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character SHA"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

  build:
    name: Build ${{ matrix.target }}
    needs: verify-source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: ags
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: ags
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: ags
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: ags
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: ags
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: ags
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ags.exe
            archive: zip

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: nightly-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@db5fb34fa772531a3ece57ca434f579eb334e0fb # v2
        with:
          tool: cross@0.2.5

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --locked
          else
            cargo build --release --target ${{ matrix.target }} --locked
          fi

      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cp README.md dist/ || true
          cp LICENSE* dist/ || true
          tar -czf ags-${{ matrix.target }}.tar.gz -C dist .
          shasum -a 256 ags-${{ matrix.target }}.tar.gz > ags-${{ matrix.target }}.tar.gz.sha256

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          Copy-Item README.md dist/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE* dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath ags-${{ matrix.target }}.zip
          $hash = (Get-FileHash "ags-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ags-${{ matrix.target }}.zip" | Out-File -Encoding ascii "ags-${{ matrix.target }}.zip.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-${{ matrix.target }}
          retention-days: 1
          path: |
            ags-${{ matrix.target }}.${{ matrix.archive }}
            ags-${{ matrix.target }}.${{ matrix.archive }}.sha256

  release:
    name: Publish rolling nightly
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: nightly-*
          path: artifacts/
          merge-multiple: true

      - name: Remove existing nightly assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view nightly-latest >/dev/null 2>&1; then
            gh release view nightly-latest --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              gh release delete-asset nightly-latest "$asset" --yes
            done
          fi

      - name: Move nightly tag
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          git tag --force nightly-latest "$COMMIT_SHA"
          git push origin +refs/tags/nightly-latest:refs/tags/nightly-latest

      - name: Publish nightly release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: nightly-latest
          name: AGS CLI Nightly
          files: artifacts/*
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Automated build of the latest validated development snapshot.

            - Snapshot commit: `${{ inputs.commit_sha }}`
            - Source pipeline: ${{ inputs.source_pipeline_url }}

            Nightly builds are replaced after each scheduled pipeline and may be less stable than versioned releases.
