name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.os }}

      - name: Run tests
        run: cargo test --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb # v2
        with:
          command: check

  dist-sync-check:
    name: Dist config sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dist
        shell: bash
        # nosemgrep -- cargo-dist bootstraps itself: official installer, HTTPS + TLS1.2, pinned v0.32.0
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"

      - name: Check dist-workspace.toml and release.yml are in sync
        run: dist generate --check

      - name: Verify release.yml hand-edits survived regeneration
        shell: bash
        run: |
          errors=0

          # Verify nosemgrep risk-acceptance comments are present in release.yml
          count=$(grep -c '# nosemgrep' .github/workflows/release.yml || echo 0)
          if [ "$count" -lt 3 ]; then
            echo "::error::Expected at least 3 '# nosemgrep' comments in release.yml, found $count"
            errors=$((errors + 1))
          fi

          # Verify ci.yml's own nosemgrep is present (curl-pipe-to-shell must be annotated)
          ci_count=$(grep -c '# nosemgrep' .github/workflows/ci.yml || echo 0)
          if [ "$ci_count" -lt 1 ]; then
            echo "::error::Missing '# nosemgrep' in ci.yml — curl-pipe-to-shell must be annotated"
            errors=$((errors + 1))
          fi

          # Verify tightened tag globs (two patterns, no open-ended wildcard)
          if ! grep -q "v\[0-9\]+\.\[0-9\]+\.\[0-9\]+'" .github/workflows/release.yml; then
            echo "::error::Missing exact-version tag glob (v[0-9]+.[0-9]+.[0-9]+) in release.yml"
            errors=$((errors + 1))
          fi
          if ! grep -q "v\[0-9\]+\.\[0-9\]+\.\[0-9\]+-\*'" .github/workflows/release.yml; then
            echo "::error::Missing prerelease tag glob (v[0-9]+.[0-9]+.[0-9]+-*) in release.yml"
            errors=$((errors + 1))
          fi

          # Verify top-level permissions are read-only (anchored to lines before 'jobs:',
          # so a job-level 'contents: read' cannot mask a top-level write)
          awk '/^jobs:/{exit} {print}' .github/workflows/release.yml | grep -q 'contents: read' || {
            echo "::error::Top-level permissions in release.yml must be 'contents: read', not 'write'"
            errors=$((errors + 1))
          }

          # Verify the PostHog key is gated on publishing (hand-edit #4)
          posthog_line=$(grep 'AGS_TELEMETRY_POSTHOG_KEY' .github/workflows/release.yml || true)
          if [ -z "$posthog_line" ]; then
            echo "::error::AGS_TELEMETRY_POSTHOG_KEY line is missing from release.yml"
            errors=$((errors + 1))
          elif ! echo "$posthog_line" | grep -q "publishing == 'true'"; then
            echo "::error::AGS_TELEMETRY_POSTHOG_KEY must be gated on publishing == 'true', not the bare vars. form"
            errors=$((errors + 1))
          fi

          # Verify plan output filters to gate-only fields, not full manifest (hand-edit #5)
          if grep -q 'jq -c "\."' .github/workflows/release.yml; then
            echo "::error::Plan job must filter plan_meta to gate-only fields, not pass the full manifest through GITHUB_OUTPUT"
            errors=$((errors + 1))
          fi
          if ! grep -q "jq -c '{ci:" .github/workflows/release.yml; then
            echo "::error::Plan job must contain the filtered jq projection (jq -c '{ci: ...}') for plan_meta"
            errors=$((errors + 1))
          fi

          # Verify host job rejects skipped builds (hand-edit #6)
          if grep -q "build-local-artifacts.result == 'skipped'" .github/workflows/release.yml || \
             grep -q "build-global-artifacts.result == 'skipped'" .github/workflows/release.yml; then
            echo "::error::Host job must require both build jobs to succeed (result == 'success'), not accept skipped builds"
            errors=$((errors + 1))
          fi
          if ! grep -q "build-local-artifacts.result == 'success'" .github/workflows/release.yml; then
            echo "::error::Host job must require build-local-artifacts.result == 'success'"
            errors=$((errors + 1))
          fi
          if ! grep -q "build-global-artifacts.result == 'success'" .github/workflows/release.yml; then
            echo "::error::Host job must require build-global-artifacts.result == 'success'"
            errors=$((errors + 1))
          fi

          # Guard against auth-scheme-shaped text in CHANGELOG.md that would
          # trigger GitHub Actions runner masking (the 0.5.1 incident).
          # The runner masks a capitalised auth scheme followed by whitespace and
          # a non-space character anywhere on the line — not only after an
          # Authorization: header name. Both incident strings (the curl example
          # and the inline `Bearer <token>` mention) match this shape.
          # Case sensitive: lower-case "bearer" was NOT masked in the incident,
          # and the approved replacement wording uses it.
          if grep -qE '\b(Bearer|Basic|Digest|NTLM|Negotiate|Token)\s+\S' CHANGELOG.md; then
            echo "::error::CHANGELOG.md contains a capitalised auth scheme followed by a value (e.g. Bearer <x>) that will trigger GitHub Actions runner masking — use lower-case or describe without a literal example"
            errors=$((errors + 1))
          fi

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors hand-edit guard(s) failed. See dist-workspace.toml for the required edits."
            exit 1
          fi
          echo "All hand-edit guards passed."
