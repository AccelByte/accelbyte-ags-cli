[workspace]
members = ["crates/accelbyte-ags-cli", "crates/ags-protocol", "crates/ags-runtime"]
resolver = "2"

[workspace.package]
version = "0.3.0"

[workspace.dependencies]
ags-protocol = { path = "crates/ags-protocol" }
ags-runtime = { path = "crates/ags-runtime" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
dirs = "6"
flate2 = "1"
rpassword = "7"
base64 = "0.22"
percent-encoding = "2"
regex = "1"
sha2 = "0.10"
rand = "0.9"
url = "2"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
fs4 = "0.8"
anstream = "1"
crossterm = "0.28"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "redactions", "yaml"] }
wiremock = "0.6"
tokio-test = "0.4"
serial_test = "3"
filetime = "0.2"
portable-pty = "0.9"
