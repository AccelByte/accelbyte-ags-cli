[workspace]
members = ["crates/accelbyte-ags-cli", "crates/ags-protocol", "crates/ags-runtime", "crates/extend-proxy-client"]
resolver = "2"

[workspace.package]
version = "0.5.0-rc.1"

[workspace.dependencies]
ags-protocol = { path = "crates/ags-protocol" }
ags-runtime = { path = "crates/ags-runtime" }
extend-proxy-client = { path = "crates/extend-proxy-client" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
dirs = "6"
flate2 = "1"
rpassword = "7"
base64 = "0.22"
percent-encoding = "2"
regex = "1"
sha2 = "0.10"
rand = "0.9"
url = "2"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
tar = "0.4"
fs4 = "0.8"
anstream = "1"
crossterm = "0.28"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "redactions", "yaml"] }
wiremock = "0.6"
tokio-test = "0.4"
serial_test = "3"
filetime = "0.2"
portable-pty = "0.9"
socket2 = "0.6"
zip = { version = "7.2", default-features = false, features = ["deflate"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
