[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# release.yml is hand-annotated with security risk-acceptances; don't regenerate over it
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# A GitHub repo to push Homebrew formulas to
tap = "AccelByte/homebrew-tap"
# Customize the Homebrew formula name
formula = "ags-cli"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Do NOT add `publish-prereleases = true` as a standing setting. It was set once, for the
# 0.5.0-rc.1 rehearsal, so that a release candidate could exercise the tap push before any
# stable release depended on it, and removed again immediately afterwards. Homebrew has no
# pre-release channel: the tap holds a single ags-cli.rb, so with the setting on, a prerelease
# tag overwrites the production formula and hands an unstable build to anyone running
# `brew upgrade`, with nothing to tell them what they received. To rehearse the tap path again,
# turn it on for that one release and take it back out in the same change that raises the
# version to the stable number.
# Whether to install an updater program
install-updater = false

# After running `dist generate`, release.yml needs these hand-edits re-applied:
#   1. Three `# nosemgrep` risk-acceptance comments (cargo-dist/rustup bootstrap lines).
#   2. Top-level `permissions: contents: read` instead of `contents: write`, with
#      per-job `permissions: contents: write` on host, publish-homebrew-formula, and
#      announce only (least-privilege scoping for PR vs tag-push triggers).
#   3. Release tag trigger uses two globs ('v[0-9]+.[0-9]+.[0-9]+' and
#      'v[0-9]+.[0-9]+.[0-9]+-*') instead of the generated open-ended wildcard.
#   4. On the build-local-artifacts job's `env:`, alongside GH_TOKEN and
#      BUILD_MANIFEST_NAME, copied EXACTLY — the `publishing` guard is the whole
#      point of the line and re-applying the bare `vars.` form would undo it:
#
#          AGS_TELEMETRY_POSTHOG_KEY: ${{ needs.plan.outputs.publishing == 'true' && vars.AGS_TELEMETRY_POSTHOG_KEY || '' }}
#
#      Why it is written that way is explained above the line in release.yml.
#      Do not restate the reasoning here: two copies of it in two files that a
#      regeneration is meant to keep in step will drift, and the copy people
#      re-apply from is this one.
# Re-apply all four after every regeneration.
#
# Tag-vs-version guard: cargo-dist natively validates that the git tag matches
# the Cargo.toml version (dist host --steps=create errors if they disagree),
# so a separate "check tag matches package version" CI step is not needed.
[dist.github-action-commits]
"actions/checkout"          = "d23441a48e516b6c34aea4fa41551a30e30af803"  # = v6
"actions/upload-artifact"   = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # = v7
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"  # = v8
